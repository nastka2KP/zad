 <script type="text/javascript"> 
  function pole_voitiuk() 
   { 
 var a_voi= parseFloat(document.getElementById('dlugosc').value); 
 var b_voi= a_voi*a_voi; 
        document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_voi.toFixed(2)+" cm^2";  
   } 
  function obwod_voitiuk() 
   { 
 var a_voi= parseFloat(document.getElementById('dlugosc').value); 
 var b_voi= 4*a_voi; 
        document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_voi.toFixed(2)+" cm";  
   } 
 </script> 
  <h1>Wszystko o KWADRACIE</h1><br><br> 
  Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br> 
  <input type="button" name="pole" value="Oblicz pole" Onclick="pole_voitiuk()"><br><br> 
  <input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod_voitiuk()"><br><br> 
  <div  style="color:red;font-size:50px;"id="nazwa"></div> 
</body>
